name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: macOS ${{ matrix.macos }}
    strategy:
      fail-fast: false
      matrix:
        macos: [15, 26]
    runs-on: macos-${{ matrix.macos }}
    steps:
      - uses: actions/checkout@v7
      - run: swift test
      - run: scripts/test-cli-json.sh
