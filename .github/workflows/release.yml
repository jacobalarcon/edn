name: Release EDN

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Import Developer ID certificate
        if: ${{ !contains(github.ref_name, '-beta.') }}
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/edn-signing.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Build universal app
        env:
          EDN_BUILD_NUMBER: ${{ github.run_number }}
          EDN_UNIVERSAL: "1"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MARKETING_VERSION="${TAG_VERSION%%-*}"
          if [[ "$TAG_VERSION" == *-beta.* ]]; then
            SIGNING_IDENTITY="-"
          else
            test -n "$APPLE_SIGNING_IDENTITY"
            SIGNING_IDENTITY="$APPLE_SIGNING_IDENTITY"
          fi
          EDN_VERSION="$MARKETING_VERSION" \
            EDN_ARCHIVE_VERSION="$TAG_VERSION" \
            EDN_CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            scripts/build-app.sh

      - name: Notarize and rebuild archive
        if: ${{ !contains(github.ref_name, '-beta.') }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/notarize.sh dist/EDN.app
          rm -f "dist/EDN-$VERSION.zip" "dist/EDN-$VERSION.zip.sha256"
          ditto -c -k --sequesterRsrc --keepParent dist/EDN.app "dist/EDN-$VERSION.zip"
          (cd dist && shasum -a 256 "EDN-$VERSION.zip" > "EDN-$VERSION.zip.sha256")

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_ARGS=(
            "$GITHUB_REF_NAME"
            "dist/EDN-$VERSION.zip"
            "dist/EDN-$VERSION.zip.sha256"
            --title "EDN $VERSION"
          )
          if [[ "$VERSION" == *-beta.* ]]; then
            RELEASE_ARGS+=(
              --prerelease
              --latest=false
              --notes-file Packaging/BetaReleaseNotes.md
            )
          else
            RELEASE_ARGS+=(--generate-notes)
          fi
          gh release create "${RELEASE_ARGS[@]}"
